<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Book time</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Book bilpleie</h1>
  <form action="https://formsubmit.co/epost@dinadresse.no" method="POST">
    <label for="navn">Navn:</label>
    <input type="text" id="navn" name="navn" required>

    <label for="epost">E-post:</label>
    <input type="email" id="epost" name="epost" required>

    <label for="dato">Ønsket dato:</label>
    <input type="date" id="dato" name="dato" required>

    <label for="biltype">Velg bilstørrelse:</label>
    <select id="biltype" name="biltype" required>
      <option value="liten">Liten bil – 2500 kr</option>
      <option value="middels">Middels bil – 3000 kr</option>
      <option value="stor">Stor bil – 4000 kr</option>
    </select>

    <label>
      <input type="checkbox" name="ekstra_vask" value="ja">
      Legg til utvendig vask (+350 kr)
    </label>

    <button type="submit">Send inn booking</button>
  </form>
</body>
</html>
